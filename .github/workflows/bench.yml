name: bench

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 0" # weekly, Sunday 03:23 UTC
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bench:
    name: ddup vs garnet vs redis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ddup (Release)
        run: |
          set -o pipefail
          {
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release &&
            cmake --build build
          } 2>&1 | tee build.log

      - name: Install redis server + tools
        run: sudo apt-get update && sudo apt-get install -y redis-server redis-tools gdb 2>&1 | tee -a build.log

      - name: Clone Garnet (shallow)
        run: git clone --depth 1 https://github.com/microsoft/garnet.git "$RUNNER_TEMP/garnet"

      - name: Build Garnet (tolerate failure)
        id: garnet
        continue-on-error: true
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: |
          cd "$RUNNER_TEMP/garnet"
          rm -f global.json
          dotnet publish main/GarnetServer -c Release -f net10.0 -o "$RUNNER_TEMP/garnet-out" >"$GITHUB_WORKSPACE/garnet-build.log" 2>&1
          tail -5 "$GITHUB_WORKSPACE/garnet-build.log"

      - name: Start all servers
        run: |
          "$GITHUB_WORKSPACE/build/ddup-server" --port 7771 --io select >"$GITHUB_WORKSPACE/ddup.log" 2>&1 &
          "$GITHUB_WORKSPACE/build/ddup-server" --port 7774 --io-threads 4 >"$GITHUB_WORKSPACE/ddup-mt4.log" 2>&1 &
          "$GITHUB_WORKSPACE/build/ddup-server" --port 7775 --io iouring >"$GITHUB_WORKSPACE/ddup-uring.log" 2>&1 &
          DDUP_IOU_RECV_MS=0 "$GITHUB_WORKSPACE/build/ddup-server" --port 7776 --io iouring-op >"$GITHUB_WORKSPACE/ddup-uring-op.log" 2>&1 &
          "$GITHUB_WORKSPACE/build/ddup-server" --port 7777 --io iouring-op >"$GITHUB_WORKSPACE/ddup-uring-ms.log" 2>&1 &
          redis-server --port 7773 --save '' --appendonly no --protected-mode no >"$GITHUB_WORKSPACE/redis.log" 2>&1 &
          if [ -f "$RUNNER_TEMP/garnet-out/GarnetServer.dll" ]; then
            dotnet "$RUNNER_TEMP/garnet-out/GarnetServer.dll" --bind 127.0.0.1 --port 7772 >"$GITHUB_WORKSPACE/garnet.log" 2>&1 &
          fi
          for p in 7771 7772 7773 7774 7775 7776 7777; do
            ok=0
            for i in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/$p) 2>/dev/null; then ok=1; break; fi
              sleep 1
            done
            echo "port $p ready=$ok"
          done
          echo "ddup PING: $(timeout 5 redis-cli -p 7771 PING || echo DOWN)"
          echo "redis PING: $(timeout 5 redis-cli -p 7773 PING || echo DOWN)"
          echo "garnet PING: $(timeout 5 redis-cli -p 7772 PING || echo DOWN)"
          echo "ddup-mt4 PING: $(timeout 5 redis-cli -p 7774 PING || echo DOWN)"
          echo "ddup-uring PING: $(timeout 5 redis-cli -p 7775 PING || echo DOWN)"
          echo "ddup-uring-op PING: $(timeout 5 redis-cli -p 7776 PING || echo DOWN)"
          echo "ddup-uring-ms PING: $(timeout 5 redis-cli -p 7777 PING || echo DOWN)"
          true

      - name: Measure (same client for all)
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          up() { timeout 5 redis-cli -p "$1" PING >/dev/null 2>&1; }
          # liveness under load: a bare PING is not enough (a backend can
          # answer PING yet stall under concurrency) -- 100 requests must
          # finish inside 15s or the variant is benched as n/a
          alive() { timeout 15 redis-benchmark -p "$1" -n 100 -c 10 -P 1 -t set -q >/dev/null 2>&1; }

          rps() { # $1=port $2=test $3=c $4=P $5=d
            timeout 60 redis-benchmark -p "$1" -t "$2" -n 200000 -c "$3" -P "$4" -d "$5" -q 2>/dev/null \
              | tr '\r' '\n' | grep -i "^$2: .*requests per second" \
              | sed -E 's/.*: ([0-9.]+) requests per second.*/\1/'
          }
          median3() { # same args as rps
            a=$(rps "$@"); b=$(rps "$@"); c=$(rps "$@")
            printf '%s\n%s\n%s\n' "${a:-0}" "${b:-0}" "${c:-0}" | sort -n | sed -n '2p'
          }
          warm() { timeout 60 redis-benchmark -p "$1" -n 10000 -c 50 -P 16 -t set,get -q >/dev/null 2>&1 || true; }
          # mt4 can enter a graceful shutdown mid-run on rare occasions
          # (trigger under investigation); before the Phase 29 stop-join
          # fix that could leave a permanently mute process. Restart it
          # as a last resort; the counter lives in a file because cell()
          # runs in a command-substitution subshell (variable increments
          # would be lost).
          restart_mt4() {
            pkill -f "ddup-server --port 7774" || true
            sleep 1
            "$GITHUB_WORKSPACE/build/ddup-server" --port 7774 --io-threads 4 >>"$GITHUB_WORKSPACE/ddup-mt4.log" 2>&1 &
            echo $(( $(cat bench-mt4-restarts 2>/dev/null || echo 0) + 1 )) > bench-mt4-restarts
            sleep 2
          }
          cell() { # port c P d -> "set/get" (n/a when the server is down)
            local s g tries
            # one retry after a pause: a transient scheduling hiccup on the
            # shared 4-CPU runner must not bench a whole variant as n/a
            for tries in 1 2 3; do
              if alive "$1"; then break; fi
              if [ "$1" = "7774" ]; then restart_mt4; else sleep 2; fi
            done
            if alive "$1"; then
              s=$(median3 "$1" set "$2" "$3" "$4")
              g=$(median3 "$1" get "$2" "$3" "$4")
              echo "$s / $g"
            else
              {
                echo "=== n/a diag port $1 ($(date -u +%H:%M:%S)) =="
                ps aux | grep "ddup-server\|GarnetServer\|redis-server" | grep -v grep || echo "no server processes"
                MTPID=$(pgrep -f "ddup-server --port $1" | head -1)
                if [ -n "$MTPID" ]; then
                  ps -T -p "$MTPID" -o tid,stat,time,wchan:32 | tail -n +2
                  grep -E "VmSize|VmRSS|FDSize" /proc/$MTPID/status
                  echo "open fds: $(ls /proc/$MTPID/fd | wc -l)"
                  # acceptor-deaf or worker-mute? a hanging client tells:
                  # fd count rises iff the acceptor accepted the conn
                  timeout 8 redis-cli -p "$1" PING >/dev/null 2>&1 &
                  local probe=$!
                  sleep 1
                  echo "fds during hanging ping: $(ls /proc/$MTPID/fd | wc -l)"
                  ss -tnp 2>/dev/null | grep ":$1" | head -5
                  wait $probe 2>/dev/null
                  timeout 5 redis-cli -p "$1" INFO 2>/dev/null | grep -E "^used_memory:|^dbsize:|^io_" || echo "INFO failed"
                  echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope >/dev/null 2>&1 || true
                  timeout 60 gdb -p "$MTPID" -batch -ex "set pagination off" -ex "thread apply all bt" 2>&1 | head -120 || echo "gdb failed"
                fi
                timeout 5 redis-cli -p "$1" PING && echo "ping OK" || echo "ping FAILED"
              } >> bench-diag.txt
              echo "n/a"
            fi
          }

          # one raw sample for debugging the parse pipeline
          timeout 120 redis-benchmark -p 7771 -t set -n 1000 -c 50 -P 16 -q > bench-raw-set.txt 2>&1 || true
          cat bench-raw-set.txt

          warm 7771; warm 7773; warm 7774; warm 7775; warm 7776; warm 7777

          # scenario matrix: c50 P16 (continuity row), c500 P16, c500 P64,
          # and 1KB values at c50 P16; every cell is "SET / GET", median of 3
          ROWS=""
          for sc in "50 16 16" "500 16 16" "500 64 16" "50 16 1024"; do
            set -- $sc
            LABEL="c$1 P$2 d$3"
            DD=$(cell 7771 "$1" "$2" "$3")
            DU=$(cell 7775 "$1" "$2" "$3")
            DO=$(cell 7776 "$1" "$2" "$3")
            DS=$(cell 7777 "$1" "$2" "$3")
            DM=$(cell 7774 "$1" "$2" "$3")
            GA=$(cell 7772 "$1" "$2" "$3")
            RD=$(cell 7773 "$1" "$2" "$3")
            ROWS="$ROWS
          | $LABEL | $DD | $DU | $DO | $DS | $DM | $GA | $RD |"
          done

          # internal consistency: ddup-bench against ddup
          DB_SET=$(./build/ddup-bench -p 7771 -n 200000 -c 50 -P 16 -t set | tail -1 | grep -oE '[0-9.]+')
          DB_GET=$(./build/ddup-bench -p 7771 -n 200000 -c 50 -P 16 -t get | tail -1 | grep -oE '[0-9.]+')

          GA_VER="unavailable"
          if up 7772; then
            GA_VER=$(git -C "$RUNNER_TEMP/garnet" rev-parse --short HEAD)
          fi

          {
            echo "# ddup vs Garnet vs Redis — loopback benchmark"
            echo
            echo "- date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- runner: $(uname -a), CPUs: $(nproc)"
            echo "- ddup commit: $(git rev-parse --short HEAD)"
            echo "- garnet commit: $GA_VER"
            echo "- $(redis-server --version)"
            echo "- client: redis-benchmark -t set|get -n 200000, median of 3; cells are SET / GET"
            echo "- ddup rows: st select (7771), st io_uring readiness (7775), st io_uring op repost (7776), st io_uring op multishot-recv (7777), mt --io-threads 4 (7774)"
            echo
            echo "| scenario | ddup-st | ddup-st-uring | ddup-st-uring-op | ddup-st-uring-ms | ddup-mt4 | garnet | redis |"
            echo "|----------|---------|---------------|------------------|------------------|----------|--------|-------|"
            echo "$ROWS"
            echo
            echo "mt4 mid-run restarts (wedge mitigation): $(cat bench-mt4-restarts 2>/dev/null || echo 0)"
            echo
            echo "internal consistency (ddup-bench on ddup-st): SET $DB_SET req/s, GET $DB_GET req/s"
          } > bench-report.md
          cat bench-report.md

      - name: Publish results to bench-results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd "$RUNNER_TEMP"
          rm -rf bres
          if ! git clone --quiet --branch bench-results --single-branch "$REPO_URL" bres; then
            git clone --quiet --no-checkout --depth 1 "$REPO_URL" bres
            git -C bres checkout --orphan bench-results
            git -C bres rm -rf . 2>/dev/null || true
          fi
          cd bres
          if [ -f "$GITHUB_WORKSPACE/bench-report.md" ]; then
            cp "$GITHUB_WORKSPACE/bench-report.md" bench-latest.md
            cp "$GITHUB_WORKSPACE/bench-report.md" "bench-$(date -u +%Y%m%d-%H%M).md"
          fi
          [ -f "$GITHUB_WORKSPACE/build.log" ] && cp "$GITHUB_WORKSPACE/build.log" . || true
          [ -f "$GITHUB_WORKSPACE/ddup.log" ] && cp "$GITHUB_WORKSPACE/ddup.log" . || true
          [ -f "$GITHUB_WORKSPACE/ddup-mt4.log" ] && cp "$GITHUB_WORKSPACE/ddup-mt4.log" . || true
          [ -f "$GITHUB_WORKSPACE/ddup-uring.log" ] && cp "$GITHUB_WORKSPACE/ddup-uring.log" . || true
          [ -f "$GITHUB_WORKSPACE/ddup-uring-op.log" ] && cp "$GITHUB_WORKSPACE/ddup-uring-op.log" . || true
          [ -f "$GITHUB_WORKSPACE/ddup-uring-ms.log" ] && cp "$GITHUB_WORKSPACE/ddup-uring-ms.log" . || true
          [ -f "$GITHUB_WORKSPACE/redis.log" ] && cp "$GITHUB_WORKSPACE/redis.log" . || true
          [ -f "$GITHUB_WORKSPACE/garnet.log" ] && cp "$GITHUB_WORKSPACE/garnet.log" . || true
          [ -f "$GITHUB_WORKSPACE/garnet-build.log" ] && cp "$GITHUB_WORKSPACE/garnet-build.log" . || true
          [ -f "$GITHUB_WORKSPACE/bench-raw-set.txt" ] && cp "$GITHUB_WORKSPACE/bench-raw-set.txt" . || true
          [ -f "$GITHUB_WORKSPACE/bench-diag.txt" ] && cp "$GITHUB_WORKSPACE/bench-diag.txt" . || true
          git config user.email ci@ddup.local
          git config user.name ddup-ci
          git add -A
          git commit -m "bench: $(date -u +%Y-%m-%d) @ ${GITHUB_SHA:0:7}" || exit 0
          git push -f origin bench-results
