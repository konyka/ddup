name: cluster-interop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # publish failure logs to ci-logs-interop

jobs:
  interop:
    name: ddup <-> redis-server cluster bus interop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Redis
        run: |
          exec > >(tee -a /tmp/interop-run.log) 2>&1
          set -x
          sudo apt-get update
          apt-cache policy redis-server redis-tools
          sudo apt-get install -y redis-server redis-tools

      - name: Build ddup
        run: |
          exec > >(tee -a /tmp/interop-run.log) 2>&1
          set -x
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: "Interop: 3 redis nodes + ddup join, converge, slot handoff"
        shell: bash
        run: |
          exec > >(tee -a /tmp/interop-run.log) 2>&1
          set -x
          R=/tmp/interop
          rm -rf $R && mkdir -p $R

          # three redis-server cluster nodes
          for p in 7001 7002 7003; do
            mkdir -p $R/rc$p
            redis-server --port $p --cluster-enabled yes \
              --cluster-config-file nodes.conf --dir $R/rc$p \
              --daemonize yes --logfile $R/rc$p/log.txt
          done
          for p in 7001 7002 7003; do
            for i in $(seq 1 30); do
              redis-cli -p $p ping 2>/dev/null | grep -q PONG && break
              sleep 1
            done
          done
          echo yes | redis-cli --cluster create 127.0.0.1:7001 127.0.0.1:7002 \
            127.0.0.1:7003 --cluster-replicas 0
          for i in $(seq 1 30); do
            redis-cli -p 7001 cluster info | grep -q "cluster_state:ok" && break
            sleep 1
          done

          # ddup as the 4th node, speaking the real redis bus protocol
          mkdir -p $R/ddup
          ./build/ddup-server --port 7400 --cluster-enabled yes \
            --cluster-bus-protocol redis --dir $R/ddup > $R/ddup/stdout.log 2>&1 &
          echo $! > $R/ddup/pid
          for i in $(seq 1 30); do
            redis-cli -p 7400 ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          # ddup claims slots 0-99 on its empty table before joining;
          # epoch 2 beats the 7001 master's creation epoch 1 for them
          for slot in $(seq 0 99); do
            timeout 10 redis-cli -p 7400 cluster addslots $slot
          done
          echo "slots claimed by ddup pre-join"

          DDUP_ID=$(redis-cli -p 7400 cluster myid | tr -d '\r')
          echo "ddup node id: $DDUP_ID"

          # redis side introduces ddup
          redis-cli -p 7001 cluster meet 127.0.0.1 7400

          ok1=0
          for i in $(seq 1 60); do
            redis-cli -p 7001 cluster nodes | grep -q "$DDUP_ID" && { ok1=1; break; }
            sleep 1
          done
          echo "assert redis-sees-ddup: $ok1"

          ok2=0
          for i in $(seq 1 60); do
            n=$(redis-cli -p 7400 cluster info | grep cluster_known_nodes | grep -oE '[0-9]+')
            [ "$n" = "4" ] && { ok2=1; break; }
            sleep 1
          done
          echo "assert ddup-known-nodes-4: $ok2"

          # ddup must see itself owning the range
          ok3a=0
          for i in $(seq 1 60); do
            timeout 10 redis-cli -p 7400 cluster nodes | grep myself | grep -q "0-99" && { ok3a=1; break; }
            sleep 1
          done
          echo "assert ddup-sees-itself-slots: $ok3a"

          ok3=0
          for i in $(seq 1 60); do
            redis-cli -p 7001 cluster nodes | grep "$DDUP_ID" | grep -q "0-99" && { ok3=1; break; }
            sleep 1
          done
          echo "assert redis-sees-ddup-slots: $ok3"
          echo "assert ddup-sees-itself-slots: $ok3a"

          # a key in the claimed range: SET on ddup, MOVED from redis
          KEY=""
          for i in $(seq 0 300); do
            sl=$(timeout 10 redis-cli -p 7001 cluster keyslot key:$i | tr -d '\r')
            [ "$sl" -lt 100 ] && { KEY="key:$i"; break; }
          done
          echo "using key '$KEY' (slot $sl)"
          timeout 10 redis-cli -p 7400 set $KEY interop-ok
          VAL=$(timeout 10 redis-cli -p 7400 get $KEY | tr -d '\r')
          echo "ddup get: $VAL"
          MOVED=$(timeout 10 redis-cli -p 7001 get $KEY 2>&1 | tr -d '\r')
          echo "redis get reply: $MOVED"

          # --- sharded pub/sub, ddup -> redis ---
          # channel hashing into ddup's 0-99 range
          CHA=""
          for i in $(seq 0 300); do
            sl=$(timeout 10 redis-cli -p 7001 cluster keyslot sch:$i | tr -d '\r')
            [ "$sl" -lt 100 ] && { CHA="sch:$i"; break; }
          done
          echo "shard channel on ddup range: '$CHA' (slot $sl)"
          timeout 60 stdbuf -oL redis-cli -p 7001 ssubscribe $CHA > $R/ssub-a.out 2>&1 &
          SSUBA=$!
          # ddup SPUBLISH -> bus PUBLISHSHARD (type 10) -> redis delivers
          okA=0
          for i in $(seq 1 20); do
            timeout 10 redis-cli -p 7400 spublish $CHA hello-from-ddup
            grep -q "hello-from-ddup" $R/ssub-a.out && { okA=1; break; }
            sleep 1
          done
          echo "assert ddup-spublish-reaches-redis: $okA"

          # --- regular pub/sub, redis -> ddup (type 4 is cluster-wide) ---
          timeout 60 stdbuf -oL redis-cli -p 7400 subscribe rchan > $R/sub-a.out 2>&1 &
          SUBA=$!
          okA2=0
          for i in $(seq 1 20); do
            timeout 10 redis-cli -p 7001 publish rchan hello-regular
            grep -q "hello-regular" $R/sub-a.out && { okA2=1; break; }
            sleep 1
          done
          echo "assert redis-publish-reaches-ddup: $okA2"
          kill $SSUBA $SUBA 2>/dev/null || true

          test "$ok1" = 1
          test "$ok2" = 1
          test "$ok3a" = 1
          test "$ok3" = 1
          test "$VAL" = "interop-ok"
          test "$okA" = 1
          test "$okA2" = 1
          echo "$MOVED" | grep -q "7400"
          echo "INTEROP PASS"

      - name: "Mixed failover: ddup slave of a killed redis master promotes"
        shell: bash
        run: |
          exec > >(tee -a /tmp/interop-run.log) 2>&1
          set -x
          R=/tmp/interop-fo
          rm -rf $R && mkdir -p $R

          # fresh 3-master redis cluster on 7101-7103
          for p in 7101 7102 7103; do
            mkdir -p $R/rc$p
            redis-server --port $p --cluster-enabled yes \
              --cluster-config-file nodes.conf --dir $R/rc$p \
              --daemonize yes --logfile $R/rc$p/log.txt
          done
          for p in 7101 7102 7103; do
            for i in $(seq 1 30); do
              redis-cli -p $p ping 2>/dev/null | grep -q PONG && break
              sleep 1
            done
          done
          echo yes | redis-cli --cluster create 127.0.0.1:7101 127.0.0.1:7102 \
            127.0.0.1:7103 --cluster-replicas 0
          for i in $(seq 1 30); do
            redis-cli -p 7102 cluster info | grep -q "cluster_state:ok" && break
            sleep 1
          done

          # ddup node 2 in redis bus mode joins, then becomes 7101's slave.
          # (data replication across implementations is RDB-incompatible and
          # full-resync fails by design; the cluster role is what matters.)
          mkdir -p $R/ddup2
          ./build/ddup-server --port 7401 --cluster-enabled yes \
            --cluster-bus-protocol redis --dir $R/ddup2 > $R/ddup2/stdout.log 2>&1 &
          for i in $(seq 1 30); do
            redis-cli -p 7401 ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          D2_ID=$(redis-cli -p 7401 cluster myid | tr -d '\r')
          M1_ID=$(redis-cli -p 7101 cluster myid | tr -d '\r')
          echo "ddup2 id: $D2_ID, redis master 7101 id: $M1_ID"
          redis-cli -p 7102 cluster meet 127.0.0.1 7401
          conv=0
          for i in $(seq 1 60); do
            n=$(redis-cli -p 7401 cluster info | grep cluster_known_nodes | grep -oE '[0-9]+')
            [ "$n" = "4" ] && { conv=1; break; }
            sleep 1
          done
          echo "assert ddup2-known-nodes-4: $conv"
          timeout 10 redis-cli -p 7401 cluster replicate $M1_ID

          # --- sharded pub/sub, redis -> ddup (before the kill) ---
          # redis propagates PUBLISHSHARD only inside the slot's shard
          # (primary + its replicas), so the ddup subscriber must hang off
          # ddup2, 7101's replica; channel hashes into 7101's 0-5460 range
          CHB=""
          for i in $(seq 0 300); do
            sl=$(timeout 10 redis-cli -p 7102 cluster keyslot rch:$i | tr -d '\r')
            [ "$sl" -le 5460 ] && { CHB="rch:$i"; break; }
          done
          echo "shard channel on 7101 range: '$CHB' (slot $sl)"
          timeout 60 stdbuf -oL redis-cli -p 7401 ssubscribe $CHB > $R/ssub-b.out 2>&1 &
          SSUBB=$!
          okB=0
          for i in $(seq 1 25); do
            timeout 10 redis-cli -p 7101 spublish $CHB hello-from-redis
            grep -q "hello-from-redis" $R/ssub-b.out && { okB=1; break; }
            sleep 1
          done
          kill $SSUBB 2>/dev/null || true
          echo "assert redis-spublish-reaches-ddup-replica: $okB"

          # kill the redis master: SIGKILL, no farewell
          pkill -9 -f "redis-server.*:7101" || true
          for i in $(seq 1 15); do
            redis-cli -p 7101 ping 2>/dev/null | grep -q PONG || break
            sleep 1
          done

          # ddup2 must detect, win the vote, promote and claim 7101's slots
          promoted=0
          for i in $(seq 1 150); do
            timeout 10 redis-cli -p 7401 cluster nodes | grep -q "myself,master" && { promoted=1; break; }
            sleep 2
          done
          echo "assert ddup2-promoted: $promoted"
          ok4=0
          for i in $(seq 1 150); do
            redis-cli -p 7102 cluster info | grep -q "cluster_state:ok" && { ok4=1; break; }
            sleep 2
          done
          echo "assert cluster-state-ok-after-failover: $ok4"

          # restart the killed master: it must rejoin and yield its slots
          redis-server --port 7101 --cluster-enabled yes \
            --cluster-config-file nodes.conf --dir $R/rc7101 \
            --daemonize yes --logfile $R/rc7101/log2.txt
          ok5=0
          for i in $(seq 1 90); do
            line=$(redis-cli -p 7102 cluster nodes | grep "$M1_ID" | tr -d '\r')
            if echo "$line" | grep -q "slave"; then ok5=1; break; fi
            if echo "$line" | grep -q "master" && ! echo "$line" | grep -q "0-5460"; then ok5=1; break; fi
            sleep 2
          done
          echo "assert old-master-yielded: $ok5 ($line)"

          test "$conv" = 1
          test "$okB" = 1
          test "$promoted" = 1
          test "$ok4" = 1
          test "$ok5" = 1
          echo "MIXED FAILOVER PASS"

      - name: Publish failure logs
        if: failure()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd "$RUNNER_TEMP"
          rm -rf cilog
          if ! git clone --quiet --branch ci-logs-interop --single-branch "$REPO_URL" cilog; then
            git clone --quiet --no-checkout --depth 1 "$REPO_URL" cilog
            git -C cilog checkout --orphan ci-logs-interop
            git -C cilog rm -rf . 2>/dev/null || true
          fi
          cd cilog
          rm -f *.log *.txt
          cp /tmp/interop-run.log . 2>/dev/null || true
          cp -r /tmp/interop logs 2>/dev/null || true
          cp -r /tmp/interop-fo logs-fo 2>/dev/null || true
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > RUN.txt
          git config user.email ci@ddup.local
          git config user.name "ddup-ci"
          git add -A
          git commit -m "interop failure logs @ ${GITHUB_SHA:0:7}" || exit 0
          git push -f origin ci-logs-interop
