name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    timeout-minutes: 30
    permissions:
      contents: write # publish failure logs to ci-logs-* branches
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cc: cl
            logbranch: ci-logs-windows
          - os: ubuntu-latest
            cc: gcc
            logbranch: ci-logs-ubuntu
          - os: macos-latest
            cc: clang
            logbranch: ci-logs-macos
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install OpenSSL (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Install OpenSSL (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install openssl

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            EXTRA="-DOPENSSL_ROOT_DIR=$(brew --prefix openssl)"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $EXTRA 2>&1 | tee configure.log
        env:
          CC: ${{ matrix.cc }}

      - name: Build
        run: cmake --build build --config Release 2>&1 | tee build.log

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release 2>&1 | tee test.log

      # Self-service diagnostics: on failure push the logs to a per-OS branch
      # so they are readable without API auth (raw.githubusercontent.com).
      - name: Publish failure logs
        if: failure() && github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          set +x
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd "$RUNNER_TEMP"
          rm -rf cilog
          if ! timeout 60 git clone --quiet --branch "${{ matrix.logbranch }}" --single-branch "$REPO_URL" cilog; then
            timeout 60 git clone --quiet --no-checkout --depth 1 "$REPO_URL" cilog
            git -C cilog checkout --orphan "${{ matrix.logbranch }}"
            git -C cilog rm -rf . 2>/dev/null || true
          fi
          cd cilog
          rm -f *.log
          cp "$GITHUB_WORKSPACE/configure.log" "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/test.log" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/build/Testing/Temporary/LastTest.log" . 2>/dev/null || true
          git config user.email ci@ddup.local
          git config user.name "ddup-ci"
          git add -A
          git commit -m "CI failure logs: ${{ matrix.os }} @ ${GITHUB_SHA:0:7}" || exit 0
          git push -f origin "${{ matrix.logbranch }}"

  freebsd:
    name: freebsd / cmake build + ctest (no OpenSSL provisioning)
    timeout-minutes: 45
    permissions:
      contents: write # publish failure logs to ci-logs-freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build & test in FreeBSD VM
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1
        with:
          prepare: pkg install -y cmake
          run: |
            {
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release &&
              cmake --build build &&
              ctest --test-dir build --output-on-failure
            } 2>&1 | tee freebsd-full.log
      - name: Publish failure logs
        if: failure() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          set +x
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd "$RUNNER_TEMP"
          rm -rf cilog
          if ! timeout 60 git clone --quiet --branch ci-logs-freebsd --single-branch "$REPO_URL" cilog; then
            timeout 60 git clone --quiet --no-checkout --depth 1 "$REPO_URL" cilog
            git -C cilog checkout --orphan ci-logs-freebsd
            git -C cilog rm -rf . 2>/dev/null || true
          fi
          cd cilog
          rm -f *.log
          cp "$GITHUB_WORKSPACE/freebsd-full.log" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/lasttest-freebsd.log" . 2>/dev/null || true
          git config user.email ci@ddup.local
          git config user.name "ddup-ci"
          git add -A
          git commit -m "CI failure logs: freebsd @ ${GITHUB_SHA:0:7}" || exit 0
          git push -f origin ci-logs-freebsd

  redis-compat:
    name: Redis command-compat audits
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch Redis command JSON baselines (sparse clones)
        run: |
          timeout 180 git clone --depth 1 --branch 7.2.15 --filter=blob:none --sparse \
            https://github.com/redis/redis.git /tmp/redis-7.2.15
          timeout 60 git -C /tmp/redis-7.2.15 sparse-checkout set src/commands
          timeout 180 git clone --depth 1 --branch 8.10.1 --filter=blob:none --sparse \
            https://github.com/redis/redis.git /tmp/redis-8.10.1
          timeout 60 git -C /tmp/redis-8.10.1 sparse-checkout set src/commands

      - name: Audit tool self-tests (TDD)
        run: python3 tools/test_audit_redis_compat.py

      - name: Redis 7.2.15 command-compat baseline check
        run: python3 tools/audit_redis_compat.py --redis-json /tmp/redis-7.2.15/src/commands --check

      - name: Redis 8.10.1 command-compat baseline check
        run: >-
          python3 tools/audit_redis_compat.py
          --redis-json /tmp/redis-8.10.1/src/commands --tag 8.10.1
          --report docs/redis-8-compat-audit.md --check

  tsan:
    name: Ubuntu / ThreadSanitizer
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure TSan
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DDDUP_SANITIZE=thread
      - name: Build TSan
        run: cmake --build build-tsan -j2
      - name: Test TSan
        run: TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1 ctest --test-dir build-tsan --output-on-failure
