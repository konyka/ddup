name: bench-debug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: mt4 per-thread state at wedge time
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build ddup (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ddup-server
      - name: Install redis-tools
        run: sudo apt-get update && sudo apt-get install -y redis-tools
      - name: Thread forensics
        run: |
          {
          set -x
          ./build/ddup-server --port 7777 --io-threads 4 >/tmp/d7.log 2>&1 &
          MTPID=$!
          sleep 2
          echo "== per-conn PING x12 =="
          for i in $(seq 1 12); do
            timeout 3 redis-cli -p 7777 PING || echo "conn $i FAILED"
          done
          echo "== threads =="
          ps -T -p $MTPID -o pid,tid,stat,time,wchan:32
          echo "== drive load until wedge =="
          for r in $(seq 1 10); do
            timeout 30 redis-benchmark -p 7777 -n 200000 -c 50 -P 16 -t set -q >/dev/null 2>&1
            if timeout 3 redis-cli -p 7777 PING >/dev/null 2>&1; then echo "round $r alive"; else echo "round $r WEDGED"; break; fi
          done
          echo "== threads after =="
          ps -T -p $MTPID -o pid,tid,stat,time,wchan:32 || echo "process gone"
          for t in /proc/$MTPID/task/*; do echo "tid ${t##*/} wchan=$(cat $t/wchan 2>/dev/null) state=$(awk '{print $3}' $t/stat 2>/dev/null)"; done
          cat /tmp/d7.log
          } > /tmp/probe.out 2>&1
          true
      - name: Publish probe output
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd "$RUNNER_TEMP"
          rm -rf dbg
          if ! git clone --quiet --branch bench-debug --single-branch "$REPO_URL" dbg; then
            git clone --quiet --no-checkout --depth 1 "$REPO_URL" dbg
            git -C dbg checkout --orphan bench-debug
            git -C dbg rm -rf . 2>/dev/null || true
          fi
          cd dbg
          cp /tmp/probe.out . || true
          git config user.email ci@ddup.local
          git config user.name "ddup-ci"
          git add -A
          git commit -m "probe @ ${GITHUB_SHA:0:7}" || exit 0
          git push -f origin bench-debug
