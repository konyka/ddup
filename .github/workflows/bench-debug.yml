name: bench-debug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: which ddup variant is mute on ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build ddup (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - name: Install redis-tools
        run: sudo apt-get update && sudo apt-get install -y redis-tools strace
      - name: Probe variants
        run: |
          set -x
          {
          uname -a
          sysctl kernel.io_uring_disabled 2>&1 || true
          ulimit -l
          ./build/ddup-server --port 7771 --io select >/tmp/d1.log 2>&1 &
          ./build/ddup-server --port 7774 --io-threads 4 >/tmp/d4.log 2>&1 &
          ./build/ddup-server --port 7775 --io iouring >/tmp/d5.log 2>&1 &
          sleep 3
          for p in 7771 7774 7775; do
            echo "== port $p =="
            timeout 5 redis-cli -p $p PING || echo "MUTE/FAIL port $p"
          done
          echo "== banners =="
          head -5 /tmp/d1.log /tmp/d4.log /tmp/d5.log
          echo "== stress each =="
          for p in 7771 7774 7775; do
            echo "== stress $p =="
            timeout 20 redis-benchmark -p $p -n 2000 -c 50 -P 16 -t set,get -q || echo "STALL port $p"
          done
          echo "== strace the uring server =="
          strace -f -tt -o /tmp/strace.log ./build/ddup-server --port 7776 --io iouring >/tmp/d6.log 2>&1 &
          sleep 3
          timeout 5 redis-cli -p 7776 PING || echo "MUTE/FAIL port 7776"
          sleep 1
          pkill -f "ddup-server --port 7776" || true
          sleep 1
          tail -30 /tmp/strace.log || true
          echo "== test_server backend probe =="
          timeout 200 ctest --test-dir build -R '^test_server$' --output-on-failure 2>&1 || true
          } > /tmp/probe.out 2>&1
          true
      - name: Publish probe output
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd "$RUNNER_TEMP"
          rm -rf dbg
          if ! git clone --quiet --branch bench-debug --single-branch "$REPO_URL" dbg; then
            git clone --quiet --no-checkout --depth 1 "$REPO_URL" dbg
            git -C dbg checkout --orphan bench-debug
            git -C dbg rm -rf . 2>/dev/null || true
          fi
          cd dbg
          cp /tmp/probe.out . || true
          git config user.email ci@ddup.local
          git config user.name "ddup-ci"
          git add -A
          git commit -m "probe @ ${GITHUB_SHA:0:7}" || exit 0
          git push -f origin bench-debug
