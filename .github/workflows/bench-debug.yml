name: bench-debug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: does a bare connect-close wedge an mt worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build ddup (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ddup-server
      - name: Install redis-tools
        run: sudo apt-get update && sudo apt-get install -y redis-tools
      - name: Bare connect-close probe
        run: |
          {
          set -x
          ./build/ddup-server --port 7777 --io-threads 4 >/tmp/d7.log 2>&1 &
          MTPID=$!
          sleep 2
          echo "== phase 1: bare connect-close x1 =="
          (echo > /dev/tcp/127.0.0.1/7777) && echo "probe sent"
          sleep 1
          for i in $(seq 1 8); do timeout 3 redis-cli -p 7777 PING || echo "ping $i FAILED"; done
          echo "== phase 2: bare connect-close x4 more =="
          for i in 1 2 3 4; do (echo > /dev/tcp/127.0.0.1/7777) || true; done
          sleep 1
          for i in $(seq 1 8); do timeout 3 redis-cli -p 7777 PING || echo "ping2 $i FAILED"; done
          echo "== phase 3: bench after bare closes =="
          timeout -k 2 20 redis-benchmark -p 7777 -n 100000 -c 50 -P 16 -t set -q 2>/dev/null | tr '\r' '\n' | grep -i "requests per second" || echo "BENCH FAILED after bare closes"
          ps -T -p $MTPID -o tid,stat,time,wchan:32 | tail -n +2
          } > /tmp/probe.out 2>&1
          true
      - name: Publish probe output
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd "$RUNNER_TEMP"
          rm -rf dbg
          if ! git clone --quiet --branch bench-debug --single-branch "$REPO_URL" dbg; then
            git clone --quiet --no-checkout --depth 1 "$REPO_URL" dbg
            git -C dbg checkout --orphan bench-debug
            git -C dbg rm -rf . 2>/dev/null || true
          fi
          cd dbg
          cp /tmp/probe.out . || true
          git config user.email ci@ddup.local
          git config user.name "ddup-ci"
          git add -A
          git commit -m "probe @ ${GITHUB_SHA:0:7}" || exit 0
          git push -f origin bench-debug
