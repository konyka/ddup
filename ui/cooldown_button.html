<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cooldown Button Demo</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #edf2f7; background: #101827; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; }
    main { width: min(34rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #2d405d; border-radius: 1rem; background: linear-gradient(145deg,#17243a,#0f1726); }
    button { position: relative; width: 100%; min-height: 3.25rem; overflow: hidden; border: 0; border-radius: .7rem; color: #08111f; background: #70e1b1; font-weight: 700; cursor: pointer; }
    button:disabled { cursor: not-allowed; color: #b7c3d4; background: #34455e; }
    #cooldown-progress { position: absolute; inset: 0 auto 0 0; width: 0; background: rgba(5,15,30,.24); transform-origin: left; pointer-events: none; }
    #label { position: relative; z-index: 1; }
    p { color: #a9b7ca; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Cooldown action</h1>
    <p id="status" role="status" aria-live="polite">Ready</p>
    <button id="action" type="button"><span id="cooldown-progress"></span><span id="label">Run action</span></button>
  </main>
  <script src="cooldown_button.js"></script>
  <script>
    const button = document.getElementById('action');
    const label = document.getElementById('label');
    const progress = document.getElementById('cooldown-progress');
    const status = document.getElementById('status');
    const controller = new CooldownButtonController({
      onRender(state) {
        button.disabled = state.disabled;
        progress.style.transform = `scaleX(${state.progress})`;
        label.textContent = state.remainingMs > 0 ? `Wait ${Math.ceil(state.remainingMs / 1000)}s` : 'Run action';
        status.textContent = state.remainingMs > 0 ? `Cooldown: ${state.remainingMs} milliseconds remaining` : 'Ready';
      }
    });
    button.addEventListener('click', () => controller.activate(performance.now(), async () => ({ cooldownMs: 3000 })));
    controller._render(performance.now());
  </script>
</body>
</html>
