# ddup-server sample configuration (redis-style: 'key value' lines,
# '#' comments, keys are case-insensitive).
#
# Usage: ddup-server path/to/ddup.conf [--key value ...]

# TCP listen address and port.
bind 0.0.0.0
port 6379

# Memory limit in bytes (0 = unlimited) and eviction policy
# (allkeys-lru | noeviction).
maxmemory 0
maxmemory-policy allkeys-lru

# Working directory for persistence files.
dir .

# Compact-encoding thresholds (Redis semantics): small hashes/zsets/sets
# live in one listpack until they exceed <entries> members or a member
# larger than <value> bytes; lists pack <size> elements per quicklist
# node. An entries or value limit of 0 disables the compact encoding for
# that type; list-max-listpack-size must be >= 1.
# list-max-listpack-size 128
# hash-max-listpack-entries 128
# hash-max-listpack-value 64
# zset-max-listpack-entries 128
# zset-max-listpack-value 64
# set-max-listpack-entries 128
# set-max-listpack-value 64

# Append-only file persistence (yes | no) and file name.
appendonly no
appendfilename appendonly.aof

# Durability policy: always (fsync every flush), everysec (at most one
# fsync per second, plus a final one on shutdown), no (never fsync).
appendfsync everysec

# Snapshot file name and automatic save interval in seconds (0 = off).
dbfilename dump.ddr
save 0

# Replication. Uncomment to run as a read-only replica of a master;
# REPLICAOF NO ONE promotes back to master at runtime.
# replicaof 127.0.0.1 6379

# Master-side replication backlog ring size in bytes (reserved for future
# partial resync).
repl-backlog-size 1048576
proto-max-request-bytes 1073741824
repl-max-snapshot-bytes 1073741824

# IO backend: select (readiness, all platforms) or iocp (Windows only;
# default is iocp on Windows, select elsewhere). TLS forces select.
# io iocp

# Single-node cluster mode (Redis cluster-compatible, owns all 16384 slots).
# Node identity persists in cluster-config-file across restarts. When enabled,
# a second listener for the cluster bus (gossip) opens on <port>+10000
# (readiness backend only; forces --io select on Windows).
# cluster-enabled yes
# cluster-config-file nodes.conf
# tls-cluster no

# TLS listener (OpenSSL build only; 0 = off). Requires both files.
# tls-port 6380
# tls-cert-file path/to/cert.pem
# tls-key-file path/to/key.pem
# tls-replication no
# tls-ca-file path/to/ca.pem
